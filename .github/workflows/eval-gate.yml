name: HW6 eval gate
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and contract tests (no API calls)
        run: python -m unittest discover -s tests -v
      - name: Validate versioned artifacts
        run: python scripts/release.py --check
      - name: Restore the accepted baseline from the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git show "${BASE_SHA}:baseline.json" > baseline.json
      - name: Compare candidate to accepted release
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -o pipefail
          python eval_gate.py --gate 2>&1 | tee gate-output.txt
      - name: Keep measured evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw6-gate-${{ github.sha }}
          path: |
            gate-output.txt
            gate_report.json
            eval_results.jsonl
            manifest.json
          if-no-files-found: warn
